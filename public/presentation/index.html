// Canvas: moving digits on curves and Fibonacci geometry. No external services.
const canvas=$('#stage'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1,P={};
function palette(){const c=getComputedStyle(document.body);for(const k of ['bg','panel','panel2','ink','muted','line','grid','green','cyan','amber','red'])P[k]=c.getPropertyValue('--'+k).trim()}
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe($('.visual'));window.addEventListener('resize',resize);
function text(s,x,y,color=P.ink,size=12,align='left',font='mono'){ctx.fillStyle=color;ctx.font=`${size}px ${font==='serif'?'Georgia':font==='sans'?'-apple-system, BlinkMacSystemFont, sans-serif':'"SFMono-Regular", Consolas, monospace'}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color=P.line,width=1,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function box(x,y,w,h,label,value,color=P.cyan){ctx.fillStyle=P.bg;ctx.fillRect(x,y,w,h);ctx.strokeStyle=P.line;ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);const s=6;for(const [dx,dy,sx,sy]of[[0,0,1,1],[w,0,-1,1],[0,h,1,-1],[w,h,-1,-1]]){line(x+dx,y+dy,x+dx+sx*s,y+dy,color);line(x+dx,y+dy,x+dx,y+dy+sy*s,color)}if(label)text(label,x+12,y+17,P.muted,9);if(value)text(value,x+12,y+h-19,color,13)}
function bezier(p,t){const u=1-t;return {x:u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6],y:u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]}}
function stream(p,color=P.cyan,lanes=2,speed=1,fade=1){ctx.save();ctx.globalAlpha=fade;ctx.strokeStyle=P.line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.bezierCurveTo(...p.slice(2));ctx.stroke();const chars='012345678901101001';for(let lane=0;lane<lanes;lane++){for(let j=0;j<23;j++){let t=((j/23+state.time*.055*speed+lane*.032)%1+1)%1;const q=bezier(p,t);ctx.globalAlpha=fade*(.2+.7*Math.pow(Math.sin(Math.PI*t),.5));text(chars[(j+lane+Math.floor(state.time*3))%chars.length],q.x,q.y+(lane-(lanes-1)/2)*10,color,10)}}ctx.restore()}
function grid(){ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=P.grid;for(let x=18;x<W;x+=24)for(let y=18;y<H;y+=24){ctx.globalAlpha=.65;ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1}
const points=Array.from({length:950},(_,i)=>{const y=1-2*(i+.5)/950,r=Math.sqrt(1-y*y),a=i*Math.PI*(3-Math.sqrt(5));return{x:Math.cos(a)*r,y,z:Math.sin(a)*r}});
function sphere(cx,cy,r,open=0,detail=false){const angle=state.time*.16,ca=Math.cos(angle),sa=Math.sin(angle),rot=.2;const items=points.map((p,i)=>{let x=p.x*ca+p.z*sa,z=-p.x*sa+p.z*ca,y=p.y;const yy=y*Math.cos(rot)-z*Math.sin(rot);z=y*Math.sin(rot)+z*Math.cos(rot);const shift=Math.sign(p.x)*open*.54*r;return{x:x*r+cx+shift,y:yy*r+cy,z,i}}).sort((a,b)=>a.z-b.z);ctx.save();for(const q of items){const light=Math.max(.15,(q.z+1)/2);ctx.globalAlpha=.15+.78*light;text('·:174980#'[Math.min(7,Math.floor(light*8))],q.x,q.y,open>.3?P.cyan:P.green,Math.max(8,r*.085))}if(open>.08){ctx.globalAlpha=open;for(let row=-4;row<=4;row++)for(let col=-3;col<=3;col++){const k=Math.abs(row*17+col*5+Math.floor(state.time*4));text('010110002000'[k%12],cx+col*r*.105,cy+row*r*.12,k%4===0?P.ink:P.amber,Math.max(9,r*.09),'center')}if(detail){ctx.globalAlpha=1;text('VALIDATE',cx,cy+r*.76,P.amber,11,'center')}}ctx.restore()}
function actProblem(){const left=35,right=W-35,cy=H*.49,gap=W*.51;const yes=state.scope===2000;
 text('ACT ON THE PHRASE',left,76,P.muted,10);text('ACT ON THE EVIDENCE',gap,76,P.green,10);
 line(W*.47,65,W*.47,H-48,P.line,1,[3,5]);
 const rand=(n)=>Math.sin(n*92.41)*.5+.5;for(let i=0;i<72;i++){const x=left+rand(i+3)*(W*.34),y=H*.3+Math.sin(state.time*(.25+rand(i)) +i)*H*.14; text(String((i+Math.floor(state.time*3))%10),x,y,i%5?P.muted:P.cyan,11)}
 box(left,H*.66,W*.36,59,'SURFACE READING','“Approved” → proceed',P.cyan);
 const from=[gap+25,H*.32],to=[right-40,H*.55];stream([from[0],from[1],gap+100,from[1],gap+65,to[1],to[0],to[1]],yes?P.green:P.amber,4);
 box(gap,H*.22,Math.min(160,W*.36),59,'REQUEST','2,000 users',P.cyan);
 box(gap,H*.66,W-gap-35,59,'EVIDENCE → ACTION',yes?'2,000 → prepare':'500 → confirm',yes?P.green:P.amber);
 text(yes?'SCOPE MATCHES':'INSUFFICIENT SCOPE',right-25,H*.55+39,yes?P.green:P.amber,10,'right');
}
function actSources(){const cx=W*.56,cy=H*.49,r=Math.min(64,H*.16),labels=['Public product','Synthetic cases','SPICED / framework','Permission records'];const ys=[H*.22,H*.40,H*.59,H*.78];for(let i=0;i<4;i++){const c=i===state.source?P.cyan:P.muted;const x=28,w=Math.min(167,W*.3);box(x,ys[i]-25,w,51,`0${i+1}`,labels[i],c);stream([x+w,ys[i],W*.4,ys[i],cx-80,cy,cx-r,cy],c,i===state.source?3:1,.7,i===state.source?1:.35)}sphere(cx,cy,r,0);stream([cx+r,cy,cx+100,cy,W-100,cy,W-35,cy],P.green,3);text('MODEL',cx,cy+r+32,P.ink,12,'center');text('evidence with provenance',cx,cy+r+52,P.muted,9,'center');text('DECIDE',W-30,cy+42,P.green,10,'right');}
function actModel(){const cx=W*.5,cy=H*.49,r=Math.min(W*.22,H*.31,150),open=state.opened;sphere(cx,cy,r,open,true);const labels=['tenant','organization','actor','capability','action',state.scope===2000?'terms ✓':'terms !'];for(let i=0;i<6;i++){const left=i<3,x=left?Math.max(24,cx-r*1.6):Math.min(W-24,cx+r*1.6),y=cy+(i%3-1)*r*.8;const c=i===5&&state.scope===500?P.amber:P.cyan;text(labels[i],x,y,c,11,left?'left':'right');line(left?x+70:x-60,y,cx+(left?-1:1)*r*.95,y,c,1,[2,5])}text(open>.5?'TEXT DOES NOT GRANT PERMISSION':'OPEN TO INSPECT',cx,H-59,open>.5?P.amber:P.muted,10,'center');text('6 axes + time + approval + revalidation',cx,H-35,P.muted,10,'center');}
function actLab(){if(state.mode==='capacity'){actCapacity();return;}const c=caseData(),r=decision(c,state.clock),initial=decision(c,100),cx=W*.49,cy=H*.43;const x1=32,x2=W-32;const midw=Math.min(186,W*.28);
 box(x1,cy-30,Math.min(153,W*.25),60,'CANDIDATE MESSAGE','“We can proceed”',P.cyan);stream([x1+Math.min(153,W*.25),cy,W*.35,cy,cx-90,cy,cx-midw/2,cy],P.cyan,3);
 box(cx-midw/2,cy-40,midw,80,'RECHECK AT DISPATCH',r.allowed?'CURRENT PERMISSION':'STOP / CONFIRM',r.allowed?P.green:P.amber);
 const endx=x2-115;stream([cx+midw/2,cy,W*.72,cy,W*.72,cy,endx,cy],r.allowed?P.green:P.amber,r.allowed?4:1,1,r.allowed?1:.25);
 box(endx,cy-30,115,60,'SIMULATED EFFECT',state.trace?`${state.trace.simulated_effects} recorded`:r.allowed?'Authorized':'Blocked',r.allowed?P.green:P.amber);
 if(state.dispatchProgress>=0){const pr=Math.min(state.dispatchProgress,1),end=r.allowed?endx+25:cx;const px=32+(end-32)*pr;ctx.fillStyle=r.allowed?P.green:P.amber;ctx.beginPath();ctx.arc(px,cy,5,0,Math.PI*2);ctx.fill();}
 const y=H*.75,start=45,len=W-90,tx=t=>start+(t-80)/40*len;line(start,y,start+len,y,P.line,2);for(const t of [80,90,100,105,110,120]){line(tx(t),y-4,tx(t),y+4,P.muted);text(String(t),tx(t),y+20,P.muted,10,'center')}
 const records=c.service_records;for(const rec of records){const color=rec.effect==='revoke'?P.red:P.green;line(tx(rec.event_time),y-22,tx(rec.event_time),y+4,color,2);text(rec.effect==='revoke'?'revokes':'grant',tx(rec.event_time),y-36,color,9,'center')}
 line(tx(100),y-9,tx(100),y+8,P.cyan,2);text('decision',tx(100),y+39,P.cyan,9,'center');line(tx(state.clock),y-15,tx(state.clock),y+8,P.ink,2);text('now',tx(state.clock),y-19,P.ink,9,'center');text('VIRTUAL FIXTURE TIME',start,y-62,P.muted,9);
 text(initial.allowed?'t = 100 · can prepare':'t = 100 · must confirm',32,H*.19,initial.allowed?P.green:P.amber,11);text(r.allowed?'now · can execute':'now · cannot execute',W-32,H*.19,r.allowed?P.green:P.amber,11,'right');
}
function actResults(){ctx.globalAlpha=.18;for(let i=0;i<4;i++)stream([15,H*.22+i*55,W*.3,H*.22+i*55,W*.7,H*.22+i*55,W-10,H*.22+i*55],P.cyan,1,.3);ctx.globalAlpha=1}
function actEnd(){const y=H*.44,cs=[W*.18,W*.5,W*.82],r=Math.min(H*.15,W*.085);const names=['OBSERVE','VERIFY','ACT'];for(let i=0;i<3;i++){sphere(cs[i],y,r,i===1?.4:0);text(`0${i+1} / ${names[i]}`,cs[i],y+r+35,i===1?P.amber:P.green,11,'center');if(i<2)stream([cs[i]+r,y,cs[i]+r+30,y,cs[i+1]-r-30,y,cs[i+1]-r,y],i===0?P.cyan:P.green,3)}line(35,H*.77,W-35,H*.77,P.line);const values=[['24/24','valid actions'],['0/12','false authorizations'],['PENDING','real sales impact']];values.forEach(([v,l],i)=>{text(v,cs[i],H*.86,i===2?P.amber:P.green,i===2?18:29,'center');text(l,cs[i],H*.93,P.muted,10,'center')});}
function updateTour(dt){if(!state.tour||$('#infoDialog').open)return;state.tourTime+=dt;const t=state.tourTime;const dest=t<13?0:t<27?1:t<42?2:t<64?3:t<99?4:5;if(dest!==state.act)go(dest,true);if(dest===0){const v=t>8?2000:500;if(v!==state.scope){state.scope=v;renderSide()}}if(dest===1){const v=Math.min(3,Math.floor((t-13)/3.5));if(v!==state.source){state.source=v;renderSide()}}if(dest===2){const o=t>31?1:0;if(o!==state.openTarget){state.openTarget=o;renderSide()}}if(dest===3){const id=t<49?'CF-01B':t<54?'CF-01A':t<58?'CF-02A':'CF-02B';const c=DATA.cases.find(c=>c.case_id===id);const time=id==='CF-02B'?Math.min(110,100+Math.floor((t-58)*2)):c.dispatch_time;if(id!==state.caseId||time!==state.clock){state.caseId=id;state.mode=id.startsWith('CF-01')?'scope':'time';state.clock=time;state.trace=null;renderSide()}}if(dest===4){const ch=t<74?'benchmark':t<83?'gates':t<91?'policy':'field';if(ch!==state.chart){state.chart=ch;renderSide();renderChart()}}if(t>=110)stopTour()}
let previous=0,drawPrevious=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-previous)/1000,.08);previous=now;if(!state.paused&&!document.hidden){state.time+=dt;state.opened+=(state.openTarget-state.opened)*Math.min(1,dt*4);if(state.dispatchProgress>=0&&state.dispatchProgress<1)state.dispatchProgress=Math.min(1,state.dispatchProgress+dt*.8);updateTour(dt)}if(now-drawPrevious<32)return;drawPrevious=now;grid();[actProblem,actSources,actModel,actLab,actResults,actEnd][state.act]();}
palette();go(0);if(state.paused){state.paused=false;pause()}requestAnimationFrame(frame);
window.GTM_DEMO={state,resolve,decision,go,selectCase,dispatch,data:DATA};
</script>
